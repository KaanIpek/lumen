# Build LUMEN for Android and iOS — without owning a Mac.
#
# Xcode only runs on macOS, and that is Apple's rule, not a limitation of this
# project. GitHub hosts real macOS machines, so the Mac is rented by the minute
# instead of bought. This is the ordinary way people on Windows ship to the App
# Store; nothing here is a workaround.
#
# WHAT IT COSTS
#   Public repository  — free.
#   Private repository — macOS minutes bill at 10x the Linux rate. An iOS build
#     of this size is a few minutes, so it is cents per run, but check your
#     account's included minutes before turning on a schedule.
#
# WHAT YOU MUST ADD FIRST  (Settings -> Secrets and variables -> Actions)
#
#   Android
#     ANDROID_KEYSTORE_B64   base64 of your upload-key .jks
#     ANDROID_KEYSTORE_PASS  its password
#     ANDROID_KEY_ALIAS      the alias inside it
#     ANDROID_KEY_PASS       the alias password
#
#   iOS  (App Store Connect -> Users and Access -> Integrations -> App Store Connect API)
#     ASC_KEY_ID             the key's id
#     ASC_ISSUER_ID          the issuer id shown above the key list
#     ASC_KEY_P8_B64         base64 of the AuthKey_XXXX.p8 you downloaded once
#     APPLE_TEAM_ID          ten characters, from the developer portal
#
# The API key is what lets `xcodebuild -allowProvisioningUpdates` create and
# download the signing assets by itself, so you never handle a .p12 or a
# provisioning profile on Windows.
#
# HONEST EXPECTATION
#   The Android job should work as soon as the four secrets exist. The FIRST iOS
#   run usually needs one or two corrections — a bundle id that does not match
#   the app record, or a capability you have not enabled yet. The log says which.
#   Budget an evening for the first green run and minutes for every one after.

name: mobile

on:
  workflow_dispatch:        # run it from the Actions tab when you want a build
  push:
    tags: ['v*']            # …and automatically for a release tag

jobs:
  android:
    runs-on: ubuntu-latest   # no Mac needed for Android at all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      # `secrets` is NOT a context you may use in an `if:`. Writing
      # `if: ${{ secrets.FOO != '' }}` does not evaluate to false — it makes the
      # whole FILE invalid, and GitHub reports that as a run with zero jobs and
      # no obvious error. Read a secret into a step's env, where it IS allowed,
      # and gate the later steps on that step's output instead.
      - name: Do we have signing secrets?
        id: keys
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stamp assets and copy the game into the shell
        run: |
          node tools/bump-version.js
          node mobile/sync-web.js

      - name: Install Capacitor and add the Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android || echo "android project already present"
          npx cap sync android

      - name: Restore the upload key
        if: steps.keys.outputs.signed == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > mobile/android/upload.jks

      - name: Build the release bundle (.aab — what Play wants)
        if: steps.keys.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          KS_PASS:   ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:  ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/../upload.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build an unsigned APK instead (no secrets yet)
        if: steps.keys.outputs.signed == 'false'
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    # macos-latest, not a pinned image. Apple raises the minimum SDK every year
    # and rejects the upload — not the build — when you fall behind, so pinning
    # buys reproducibility today and a dead pipeline in twelve months.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Runner images ship several Xcodes and default to an older one. macos-14
      # defaulted to 15.4, whose iOS 17.5 SDK App Store Connect now refuses:
      #
      #   Validation failed (409) SDK version issue. This app was built with the
      #   iOS 17.5 SDK. All iOS and iPadOS apps must be built with the iOS 26 SDK
      #   or later.
      #
      # That check happens at UPLOAD, so the archive succeeds, the export
      # succeeds, and ten minutes later it fails on a rule that had nothing to do
      # with the build. Pick the newest Xcode present and say which one, so the
      # log answers "what SDK was this?" without anyone guessing.
      - name: Use the newest Xcode on this runner
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # `steps` is scoped to ONE job, so this cannot borrow the android job's
      # check — without its own copy every `if:` below would compare against an
      # empty string, match neither branch, and skip the entire iOS job in
      # silence. Same reason as there: secrets are not allowed in an `if:`.
      - name: Do we have signing secrets?
        id: keys
        env:
          P8: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          if [ -n "$P8" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stamp assets and copy the game into the shell
        run: |
          node tools/bump-version.js
          node mobile/sync-web.js

      - name: Install Capacitor and add the iOS project
        working-directory: mobile
        run: |
          npm install
          npx cap add ios || echo "ios project already present"
          npx cap sync ios

      # The app icon. `npx cap add ios` does NOT take the web icons — it leaves
      # Capacitor's placeholder in the asset catalog, so build 1 went to
      # TestFlight wearing a stranger's icon and nobody would have noticed until
      # it was on a home screen.
      #
      # Xcode wants one 1024 image and a Contents.json, and it must have NO alpha
      # channel; assets/icon-1024-ios.png is the flattened copy that
      # tools/make-ios-icon.js produces for exactly this.
      - name: Install the app icon
        working-directory: mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset
        run: |
          rm -f *.png
          cp "$GITHUB_WORKSPACE/assets/icon-1024-ios.png" AppIcon-512@2x.png
          cat > Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          ls -l

      # The launch image. `cap add ios` ships a placeholder here too, and nobody
      # replaced it — so the app opened on a stale picture unrelated to the icon
      # on the home screen, which is the first thing a player sees and the last
      # thing anyone thinks to check.
      #
      # It is a flat #05060f, the same colour as the menu that follows, so the
      # launch reads as the app appearing rather than two screens arguing.
      - name: Install the launch image
        working-directory: mobile/ios/App/App/Assets.xcassets/Splash.imageset
        run: |
          rm -f *.png
          for n in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do
            cp "$GITHUB_WORKSPACE/assets/splash-2732.png" "$n"
          done
          cat > Contents.json <<'JSON'
          {
            "images" : [
              { "filename" : "splash-2732x2732.png",   "idiom" : "universal", "scale" : "1x" },
              { "filename" : "splash-2732x2732-1.png", "idiom" : "universal", "scale" : "2x" },
              { "filename" : "splash-2732x2732-2.png", "idiom" : "universal", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          ls -l

      # Two Info.plist facts, set here because the iOS project is generated on
      # this runner and does not exist in the repository.
      #
      # ITSAppUsesNonExemptEncryption=false answers, permanently, the export
      # compliance question App Store Connect asks on EVERY upload. The game
      # uses no cryptography of its own — HTTPS to Supabase is exempt — so the
      # honest answer is false, and declaring it here stops it blocking a build
      # at 2am. Say so only while it stays true.
      #
      # UIRequiresFullScreen keeps a fullscreen arcade game out of iPad
      # multitasking, where a resized window mid-run is a death.
      - name: Declare export compliance and fullscreen
        working-directory: mobile/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" Info.plist
          # iOS TERMINATES an app that reaches for the microphone with no usage
          # string, and review rejects it. Voice control is opt-in and off by
          # default, but "off by default" is not "absent": the moment a player
          # turns it on, an app without these two keys dies on the spot.
          MIC="Voice control lets you fire a held item by saying its name. The microphone is used only while that switch is on, and this app records nothing and sends nothing anywhere."
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $MIC" Info.plist             || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription $MIC" Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string $MIC" Info.plist             || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription $MIC" Info.plist
          /usr/libexec/PlistBuddy -c "Print" Info.plist | grep -E "NonExempt|FullScreen"

      # Without the API key there is nothing to sign with, so build the app
      # WITHOUT signing. That still proves the project compiles, which is most
      # of what an early run is for.
      - name: Compile only (no signing secrets yet)
        if: steps.keys.outputs.signed == 'false'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Restore the App Store Connect API key
        if: steps.keys.outputs.signed == 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_B64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # THE fix, and it has to happen in the project file rather than on the
      # command line.
      #
      # `npx cap add ios` writes CODE_SIGN_IDENTITY = "iPhone Developer" into the
      # Release configuration. With that, automatic signing asks Apple for an
      # "iOS App Development" profile no matter what the archive command says —
      # and development profiles are built FROM REGISTERED DEVICES, so an account
      # with none gets "Your team has no devices from which to generate a
      # provisioning profile", which reads like a wrong bundle id and is not.
      #
      # Passing CODE_SIGN_IDENTITY to xcodebuild instead does not work: a build
      # setting on the command line applies to EVERY target in the workspace,
      # including all the CocoaPods ones that must not be signed at all, and Xcode
      # treats a named identity as MANUAL signing, so it then collides with the
      # project's automatic style ("automatically signed for development, but a
      # conflicting code signing identity has been manually specified").
      #
      # Editing App.xcodeproj leaves Pods.xcodeproj alone and keeps the style
      # automatic. App Store distribution profiles need no devices, so this is
      # also what makes the whole thing work on an account that owns no iPhone.
      # Take the identity OUT rather than change it. Four runs went into
      # discovering that, with CODE_SIGN_STYLE = Automatic, naming an identity at
      # all is what Xcode calls "manually specified":
      #
      #   App is automatically signed for development, but a conflicting code
      #   signing identity Apple Distribution has been manually specified.
      #
      # Setting it to the DEVELOPMENT value Capacitor ships is no better — that
      # makes Xcode ask Apple for a development profile, and those are built from
      # registered devices, which this account has none of. Both roads end in a
      # failed archive. The only setting automatic signing is happy with is no
      # setting, so the lines go.
      - name: Let automatic signing choose the identity
        if: steps.keys.outputs.signed == 'true'
        working-directory: mobile/ios/App
        run: |
          echo "--- before ---"
          grep -n 'CODE_SIGN_IDENTITY' App.xcodeproj/project.pbxproj || echo "(none)"
          sed -i '' '/CODE_SIGN_IDENTITY/d' App.xcodeproj/project.pbxproj
          echo "--- after ---"
          grep -n 'CODE_SIGN_IDENTITY' App.xcodeproj/project.pbxproj || echo "(none, which is the point)"

      - name: Archive and export a signed .ipa
        if: steps.keys.outputs.signed == 'true'
        working-directory: mobile/ios/App
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          # ARCHIVE UNSIGNED, SIGN ON EXPORT.
          #
          # Signing at archive time is what five runs failed at, in two different
          # ways depending on what the identity said. It is also unnecessary: the
          # archive is an intermediate, and `-exportArchive` re-signs whatever it
          # is given. Doing it there means exactly one place asks Apple for a
          # profile, that place knows from `method: app-store` that it wants a
          # DISTRIBUTION one, and distribution profiles need no registered
          # devices — which is the whole reason this can run on an account that
          # owns no iPhone.
          #
          # -destination generic/platform=iOS rather than -sdk iphoneos: an
          # archive wants a generic destination, not a device to resolve against.
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LUMEN.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LUMEN.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

      # Uploading is deliberately a SEPARATE, manual choice. A push that
      # silently ships a build to TestFlight is how the wrong thing reaches
      # testers; download the .ipa, look at it, then run this on purpose.
      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && steps.keys.outputs.signed == 'true'
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}
