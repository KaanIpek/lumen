# Build LUMEN for Android and iOS — without owning a Mac.
#
# Xcode only runs on macOS, and that is Apple's rule, not a limitation of this
# project. GitHub hosts real macOS machines, so the Mac is rented by the minute
# instead of bought. This is the ordinary way people on Windows ship to the App
# Store; nothing here is a workaround.
#
# WHAT IT COSTS
#   Public repository  — free.
#   Private repository — macOS minutes bill at 10x the Linux rate. An iOS build
#     of this size is a few minutes, so it is cents per run, but check your
#     account's included minutes before turning on a schedule.
#
# WHAT YOU MUST ADD FIRST  (Settings -> Secrets and variables -> Actions)
#
#   Android
#     ANDROID_KEYSTORE_B64   base64 of your upload-key .jks
#     ANDROID_KEYSTORE_PASS  its password
#     ANDROID_KEY_ALIAS      the alias inside it
#     ANDROID_KEY_PASS       the alias password
#
#   iOS  (App Store Connect -> Users and Access -> Integrations -> App Store Connect API)
#     ASC_KEY_ID             the key's id
#     ASC_ISSUER_ID          the issuer id shown above the key list
#     ASC_KEY_P8_B64         base64 of the AuthKey_XXXX.p8 you downloaded once
#     APPLE_TEAM_ID          ten characters, from the developer portal
#
# The API key is what lets `xcodebuild -allowProvisioningUpdates` create and
# download the signing assets by itself, so you never handle a .p12 or a
# provisioning profile on Windows.
#
# HONEST EXPECTATION
#   The Android job should work as soon as the four secrets exist. The FIRST iOS
#   run usually needs one or two corrections — a bundle id that does not match
#   the app record, or a capability you have not enabled yet. The log says which.
#   Budget an evening for the first green run and minutes for every one after.

name: mobile

on:
  workflow_dispatch:        # run it from the Actions tab when you want a build
  push:
    tags: ['v*']            # …and automatically for a release tag

jobs:
  android:
    runs-on: ubuntu-latest   # no Mac needed for Android at all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: actions/setup-java@v4
        with: { distribution: 'temurin', java-version: '17' }

      # `secrets` is NOT a context you may use in an `if:`. Writing
      # `if: ${{ secrets.FOO != '' }}` does not evaluate to false — it makes the
      # whole FILE invalid, and GitHub reports that as a run with zero jobs and
      # no obvious error. Read a secret into a step's env, where it IS allowed,
      # and gate the later steps on that step's output instead.
      - name: Do we have signing secrets?
        id: keys
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stamp assets and copy the game into the shell
        run: |
          node tools/bump-version.js
          node mobile/sync-web.js

      - name: Install Capacitor and add the Android project
        working-directory: mobile
        run: |
          npm install
          npx cap add android || echo "android project already present"
          npx cap sync android

      - name: Restore the upload key
        if: steps.keys.outputs.signed == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > mobile/android/upload.jks

      - name: Build the release bundle (.aab — what Play wants)
        if: steps.keys.outputs.signed == 'true'
        working-directory: mobile/android
        env:
          KS_PASS:   ${{ secrets.ANDROID_KEYSTORE_PASS }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS:  ${{ secrets.ANDROID_KEY_PASS }}
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$PWD/../upload.jks \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - name: Build an unsigned APK instead (no secrets yet)
        if: steps.keys.outputs.signed == 'false'
        working-directory: mobile/android
        run: ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: |
            mobile/android/app/build/outputs/bundle/release/*.aab
            mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn

  ios:
    # macos-latest, not a pinned image. Apple raises the minimum SDK every year
    # and rejects the upload — not the build — when you fall behind, so pinning
    # buys reproducibility today and a dead pipeline in twelve months.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      # Runner images ship several Xcodes and default to an older one. macos-14
      # defaulted to 15.4, whose iOS 17.5 SDK App Store Connect now refuses:
      #
      #   Validation failed (409) SDK version issue. This app was built with the
      #   iOS 17.5 SDK. All iOS and iPadOS apps must be built with the iOS 26 SDK
      #   or later.
      #
      # That check happens at UPLOAD, so the archive succeeds, the export
      # succeeds, and ten minutes later it fails on a rule that had nothing to do
      # with the build. Pick the newest Xcode present and say which one, so the
      # log answers "what SDK was this?" without anyone guessing.
      - name: Use the newest Xcode on this runner
        run: |
          ls -d /Applications/Xcode*.app
          NEWEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "selecting $NEWEST"
          sudo xcode-select -s "$NEWEST/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos

      # `steps` is scoped to ONE job, so this cannot borrow the android job's
      # check — without its own copy every `if:` below would compare against an
      # empty string, match neither branch, and skip the entire iOS job in
      # silence. Same reason as there: secrets are not allowed in an `if:`.
      - name: Do we have signing secrets?
        id: keys
        env:
          P8: ${{ secrets.ASC_KEY_P8_B64 }}
        run: |
          if [ -n "$P8" ]; then echo "signed=true" >> "$GITHUB_OUTPUT"
          else echo "signed=false" >> "$GITHUB_OUTPUT"; fi

      - name: Stamp assets and copy the game into the shell
        run: |
          node tools/bump-version.js
          node mobile/sync-web.js

      - name: Install Capacitor and add the iOS project
        working-directory: mobile
        run: |
          npm install
          npx cap add ios || echo "ios project already present"

          # Pin the consent SDK before pods are installed.
          #
          # @capacitor-community/admob v6 is written against UserMessagingPlatform
          # 2.x. CocoaPods resolves to the newest by default, and UMP 3.0 renamed
          # the very things the plugin calls, so the ARCHIVE fails to compile:
          #
          #   ConsentExecutor.swift: error: 'sharedInstance' …  'UMPConsentStatus' …
          #
          # That is a build failure, not a signing one, so the unsigned fallback
          # cannot rescue it — nothing ships at all. Pin the dependency rather
          # than chase a plugin version that wants Capacitor 7.
          python3 - <<'PYEOF'
          import io, os
          p = 'ios/App/Podfile'
          if not os.path.exists(p):
              print('no Podfile yet'); raise SystemExit(0)
          s = io.open(p, encoding='utf-8').read()
          if 'GoogleUserMessagingPlatform' in s:
              print('already pinned'); raise SystemExit(0)
          NL = chr(10)
          pin = "  pod 'GoogleUserMessagingPlatform', '~> 2.7'"
          lines = s.split(NL)
          for i, l in enumerate(lines):
              if l.strip().startswith("pod 'Capacitor'"):
                  lines.insert(i, pin)
                  break
          else:
              raise SystemExit("could not find the Capacitor pod line to anchor to")
          io.open(p, 'w', encoding='utf-8', newline=NL).write(NL.join(lines))
          print('pinned UserMessagingPlatform to 2.7')
          PYEOF

          npx cap sync ios

      # The app icon. `npx cap add ios` does NOT take the web icons — it leaves
      # Capacitor's placeholder in the asset catalog, so build 1 went to
      # TestFlight wearing a stranger's icon and nobody would have noticed until
      # it was on a home screen.
      #
      # Xcode wants one 1024 image and a Contents.json, and it must have NO alpha
      # channel; assets/icon-1024-ios.png is the flattened copy that
      # tools/make-ios-icon.js produces for exactly this.
      - name: Install the app icon
        working-directory: mobile/ios/App/App/Assets.xcassets/AppIcon.appiconset
        run: |
          rm -f *.png
          cp "$GITHUB_WORKSPACE/assets/icon-1024-ios.png" AppIcon-512@2x.png
          cat > Contents.json <<'JSON'
          {
            "images" : [
              {
                "filename" : "AppIcon-512@2x.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          ls -l

      # The launch image. `cap add ios` ships a placeholder here too, and nobody
      # replaced it — so the app opened on a stale picture unrelated to the icon
      # on the home screen, which is the first thing a player sees and the last
      # thing anyone thinks to check.
      #
      # It is a flat #05060f, the same colour as the menu that follows, so the
      # launch reads as the app appearing rather than two screens arguing.
      - name: Install the launch image
        working-directory: mobile/ios/App/App/Assets.xcassets/Splash.imageset
        run: |
          rm -f *.png
          for n in splash-2732x2732.png splash-2732x2732-1.png splash-2732x2732-2.png; do
            cp "$GITHUB_WORKSPACE/assets/splash-2732.png" "$n"
          done
          cat > Contents.json <<'JSON'
          {
            "images" : [
              { "filename" : "splash-2732x2732.png",   "idiom" : "universal", "scale" : "1x" },
              { "filename" : "splash-2732x2732-1.png", "idiom" : "universal", "scale" : "2x" },
              { "filename" : "splash-2732x2732-2.png", "idiom" : "universal", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          JSON
          ls -l

      # Two Info.plist facts, set here because the iOS project is generated on
      # this runner and does not exist in the repository.
      #
      # ITSAppUsesNonExemptEncryption=false answers, permanently, the export
      # compliance question App Store Connect asks on EVERY upload. The game
      # uses no cryptography of its own — HTTPS to Supabase is exempt — so the
      # honest answer is false, and declaring it here stops it blocking a build
      # at 2am. Say so only while it stays true.
      #
      # UIRequiresFullScreen keeps a fullscreen arcade game out of iPad
      # multitasking, where a resized window mid-run is a death.
      - name: Declare export compliance and fullscreen
        working-directory: mobile/ios/App/App
        run: |
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" Info.plist
          /usr/libexec/PlistBuddy -c "Add :UIRequiresFullScreen bool true" Info.plist \
            || /usr/libexec/PlistBuddy -c "Set :UIRequiresFullScreen true" Info.plist
          # iOS TERMINATES an app that reaches for the microphone with no usage
          # string, and review rejects it. Voice control is opt-in and off by
          # default, but "off by default" is not "absent": the moment a player
          # turns it on, an app without these two keys dies on the spot.
          MIC="Voice control lets you fire a held item by saying its name. The microphone is used only while that switch is on, and this app records nothing and sends nothing anywhere."
          /usr/libexec/PlistBuddy -c "Add :NSMicrophoneUsageDescription string $MIC" Info.plist             || /usr/libexec/PlistBuddy -c "Set :NSMicrophoneUsageDescription $MIC" Info.plist
          /usr/libexec/PlistBuddy -c "Add :NSSpeechRecognitionUsageDescription string $MIC" Info.plist             || /usr/libexec/PlistBuddy -c "Set :NSSpeechRecognitionUsageDescription $MIC" Info.plist
          /usr/libexec/PlistBuddy -c "Print" Info.plist | grep -E "NonExempt|FullScreen"

      # Sign in with Apple needs the entitlement in the BUILD, not only on the
      # App ID. Turning the capability on in the developer portal is what lets a
      # profile carry it; without this file the native sheet does not open at
      # all, and the failure is silent — the button does nothing and there is no
      # error to read.
      #
      # `npx cap add ios` generates no entitlements file, so this creates one and
      # points the project at it. CODE_SIGN_ENTITLEMENTS is set per build
      # configuration because the archive uses Release and a missing path there
      # fails the signing step rather than the compile.
      - name: Add the Sign in with Apple entitlement
        working-directory: mobile/ios/App
        run: |
          cat > App/App.entitlements <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.developer.applesignin</key>
            <array><string>Default</string></array>
          </dict></plist>
          PLIST
          # Strip the heredoc's leading indentation — PlistBuddy and codesign both
          # reject a plist whose declaration is not the first thing in the file.
          sed -i '' 's/^          //' App/App.entitlements
          /usr/libexec/PlistBuddy -c "Print" App/App.entitlements
          python3 - <<'PY'
          import re, io
          p = 'App.xcodeproj/project.pbxproj'
          s = io.open(p, encoding='utf-8').read()
          if 'CODE_SIGN_ENTITLEMENTS' in s:
              print('entitlement path already set')
          else:
              # Every build configuration that names the app's product gets it.
              n = 0
              def add(m):
                  global n
                  n += 1
                  return m.group(0) + '\n\t\t\t\tCODE_SIGN_ENTITLEMENTS = App/App.entitlements;'
              s = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', add, s)
              io.open(p, 'w', encoding='utf-8', newline='\n').write(s)
              print('set CODE_SIGN_ENTITLEMENTS in %d configurations' % n)
              if n == 0:
                  raise SystemExit('found no build configuration to attach it to')
          PY

      # Without the API key there is nothing to sign with, so build the app
      # WITHOUT signing. That still proves the project compiles, which is most
      # of what an early run is for.
      - name: Compile only (no signing secrets yet)
        if: steps.keys.outputs.signed == 'false'
        working-directory: mobile/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            build

      - name: Restore the App Store Connect API key
        if: steps.keys.outputs.signed == 'true'
        run: |
          mkdir -p ~/private_keys
          echo "${{ secrets.ASC_KEY_P8_B64 }}" | base64 -d > ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8

      # THE fix, and it has to happen in the project file rather than on the
      # command line.
      #
      # `npx cap add ios` writes CODE_SIGN_IDENTITY = "iPhone Developer" into the
      # Release configuration. With that, automatic signing asks Apple for an
      # "iOS App Development" profile no matter what the archive command says —
      # and development profiles are built FROM REGISTERED DEVICES, so an account
      # with none gets "Your team has no devices from which to generate a
      # provisioning profile", which reads like a wrong bundle id and is not.
      #
      # Passing CODE_SIGN_IDENTITY to xcodebuild instead does not work: a build
      # setting on the command line applies to EVERY target in the workspace,
      # including all the CocoaPods ones that must not be signed at all, and Xcode
      # treats a named identity as MANUAL signing, so it then collides with the
      # project's automatic style ("automatically signed for development, but a
      # conflicting code signing identity has been manually specified").
      #
      # Editing App.xcodeproj leaves Pods.xcodeproj alone and keeps the style
      # automatic. App Store distribution profiles need no devices, so this is
      # also what makes the whole thing work on an account that owns no iPhone.
      # Take the identity OUT rather than change it. Four runs went into
      # discovering that, with CODE_SIGN_STYLE = Automatic, naming an identity at
      # all is what Xcode calls "manually specified":
      #
      #   App is automatically signed for development, but a conflicting code
      #   signing identity Apple Distribution has been manually specified.
      #
      # Setting it to the DEVELOPMENT value Capacitor ships is no better — that
      # makes Xcode ask Apple for a development profile, and those are built from
      # registered devices, which this account has none of. Both roads end in a
      # failed archive. The only setting automatic signing is happy with is no
      # setting, so the lines go.
      - name: Let automatic signing choose the identity
        if: steps.keys.outputs.signed == 'true'
        working-directory: mobile/ios/App
        run: |
          echo "--- before ---"
          grep -n 'CODE_SIGN_IDENTITY' App.xcodeproj/project.pbxproj || echo "(none)"
          sed -i '' '/CODE_SIGN_IDENTITY/d' App.xcodeproj/project.pbxproj
          echo "--- after ---"
          grep -n 'CODE_SIGN_IDENTITY' App.xcodeproj/project.pbxproj || echo "(none, which is the point)"


      # Real signing assets, so the ARCHIVE can be signed like on any other Mac.
      #
      # Cloud signing (-allowProvisioningUpdates) keeps the private key at
      # Apple. That is enough for -exportArchive and for nothing else, so the
      # archive stayed unsigned, the packaging step that writes entitlements
      # never ran, and com.apple.developer.applesignin was missing from every
      # build. Three xcodebuild flags were tried against that and all three are
      # closed; the flags were never the problem. A private key on this machine
      # is. tools/asc-signing-assets.js makes one and has Apple certify it.
      - name: Make signing assets and load them
        if: steps.keys.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          node "$GITHUB_WORKSPACE/tools/asc-signing-assets.js" --out "$RUNNER_TEMP/signing"
          P12=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/signing/signing.json'))['p12'])")
          PASS=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/signing/signing.json'))['p12Password'])")
          UUID=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/signing/signing.json'))['profileUUID'])")
          IDENT=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/signing/signing.json'))['identity'])")
          echo "identity to sign with: $IDENT"

          # A keychain of our own, unlocked, and in the SEARCH LIST — the last
          # part is what an earlier attempt missed, which is why codesign could
          # read an identity's name and had no key behind it.
          KC="$RUNNER_TEMP/lumen.keychain-db"
          KCPASS=$(uuidgen)
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          security import "$P12" -k "$KC" -P "$PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          echo '--- identities now visible ---'
          security find-identity -v -p codesigning

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp "$RUNNER_TEMP/signing/profile.mobileprovision"              ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
          echo "installed profile $UUID"

          # Manual signing, in the PROJECT and only for the app target. On the
          # command line it would reach every Pods target, and that collision
          # has already cost four runs.
          cd "$GITHUB_WORKSPACE/mobile/ios/App"
          IDENT="$IDENT" TEAMID="${{ secrets.APPLE_TEAM_ID }}" python3 - <<'PYEOF'
          import re, io
          p = 'App.xcodeproj/project.pbxproj'
          s = io.open(p, encoding='utf-8').read()
          TAB = chr(9); NL = chr(10)
          import os
          ident = os.environ['IDENT']
          team = os.environ.get('TEAMID', '')
          add = (NL + TAB*4 + 'CODE_SIGN_STYLE = Manual;'
                 + NL + TAB*4 + 'DEVELOPMENT_TEAM = ' + team + ';'
                 + NL + TAB*4 + 'CODE_SIGN_IDENTITY = "' + ident + '";'
                 + NL + TAB*4 + 'PROVISIONING_PROFILE_SPECIFIER = "LUMEN CI App Store";')
          n = 0
          def go(m):
              global n
              n += 1
              return m.group(0) + add
          s = re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', go, s)
          io.open(p, 'w', encoding='utf-8', newline=NL).write(s)
          print('manual signing set in %d configurations' % n)
          PYEOF

      - name: Archive and export a signed .ipa
        if: steps.keys.outputs.signed == 'true'
        working-directory: mobile/ios/App
        run: |
          cat > ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          # ARCHIVE UNSIGNED, SIGN ON EXPORT.
          #
          # Signing at archive time is what five runs failed at, in two different
          # ways depending on what the identity said. It is also unnecessary: the
          # archive is an intermediate, and `-exportArchive` re-signs whatever it
          # is given. Doing it there means exactly one place asks Apple for a
          # profile, that place knows from `method: app-store` that it wants a
          # DISTRIBUTION one, and distribution profiles need no registered
          # devices — which is the whole reason this can run on an account that
          # owns no iPhone.
          #
          # -destination generic/platform=iOS rather than -sdk iphoneos: an
          # archive wants a generic destination, not a device to resolve against.
          # iPhone AND iPad, explicitly — Capacitor's "1,2" default is right, but
          # a device family this build depends on should not be inherited silently.
          #
          # This briefly went to iPhone only, on a measurement that was wrong: the
          # iPad screenshot was rendered into a 2048-point viewport, which is the
          # PHYSICAL width. No iPad has that; the 13-inch is 1024 points. The orb
          # was never the 0.9% speck that number implied.
          #
          # What was true is that the corridor stretched to whatever width it was
          # given, so a tablet got the same game spread thin — and in landscape,
          # a much harder one. The playfield is a phone-shaped column now
          # (js/game.js, resize), so every device draws the orb at 5.1% of the
          # stage and the openings at the same 9-11 orb-diameters.
          #
          # IPHONEOS_DEPLOYMENT_TARGET is set here because nothing else set it:
          # the build inherited Capacitor's iOS 13, and Apple flagged it as a
          # minimum that stops being accepted in 2027. 15.0 clears the warning
          # while still reaching the iPhone 6s. This game is a canvas in a
          # WKWebView and asks nothing of a newer OS, so the only thing a higher
          # floor would buy is fewer players.
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/LUMEN.xcarchive" \
            TARGETED_DEVICE_FAMILY="1,2" \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            archive || {
            # No signing flags here on purpose: the app target now carries manual
            # signing in the project, with a certificate whose private key is on
            # this machine. Naming any of it on the command line would push it
            # onto every Pods target too, which is the collision that cost four
            # runs.
            #
            # THREE WAYS THAT DID NOT WORK, each measured from a real run:
            #
            #   no identity          -> automatic signing asks for an iOS App
            #                           Development profile, which is built from
            #                           registered devices this account has none of
            #   "Apple Distribution" -> "automatically signed for development, but
            #                           a conflicting code signing identity has
            #                           been manually specified"
            #   "-" (ad hoc)         -> "Ad Hoc code signing is not allowed with
            #                           SDK 'iOS 26.5'", and the setting reaches
            #                           every Pods target as well
            #
            # So the archive stays unsigned, and the cost is real: Xcode never
            # runs the packaging step that writes entitlements into the binary,
            # so com.apple.developer.applesignin is absent from every build and
            # the native Sign in with Apple sheet returns AuthorizationError.
            #
            # The way out is not another xcodebuild flag. It is to stop depending
            # on cloud signing: generate a key and CSR here, create a distribution
            # certificate through the App Store Connect API, import both into a
            # keychain and sign manually. Then a private key exists locally and
            # none of this is special. That is a piece of work, not a tweak.
            # Signing HERE is the only way to get entitlements into the binary.
            # With signing off Xcode skips the packaging step that embeds them,
            # so the export re-signs with the profile's bare minimum and
            # com.apple.developer.applesignin is simply absent. Re-signing after
            # the fact cannot rescue it either: cloud signing leaves the
            # certificate in a temporary keychain, so codesign knows the
            # identity's NAME and has no key to sign with. Both were measured,
            # not assumed.
            #
            # But five runs died on archive-time signing before this, and a
            # pipeline that stops shipping is worse than one feature that does
            # not work. So try the thing that fixes it, keep the thing that works.
            echo "SIGNED ARCHIVE FAILED — falling back to the unsigned one."
            echo "Sign in with Apple will not work in this build."
            rm -rf "$RUNNER_TEMP/LUMEN.xcarchive"
            xcodebuild -workspace App.xcworkspace -scheme App \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath "$RUNNER_TEMP/LUMEN.xcarchive" \
              TARGETED_DEVICE_FAMILY="1,2" \
              IPHONEOS_DEPLOYMENT_TARGET=15.0 \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
              archive
          }
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LUMEN.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyPath ~/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8 \
            -authenticationKeyID ${{ secrets.ASC_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.ASC_ISSUER_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: warn

      # Put the entitlement back into the SIGNED app.
      #
      # The archive is deliberately built with CODE_SIGNING_ALLOWED=NO -- five
      # runs failed before that, and it is what finally made this work on a Mac
      # nobody owns. But with signing off Xcode never runs the packaging step
      # that embeds entitlements, so the archived binary carries none, and
      # `-exportArchive` re-signs it with only the minimum the profile demands.
      #
      # The diagnostic below proved exactly that: the PROFILE granted
      # com.apple.developer.applesignin and the signed app did not have it. On a
      # phone that is AuthorizationError, an error that mentions neither.
      #
      # So take the entitlements the export produced, add ours, and re-sign the
      # app bundle with them. --preserve-metadata deliberately does NOT list
      # `entitlements`; preserving those is the bug.
      - name: Re-sign with the Sign in with Apple entitlement
        if: steps.keys.outputs.signed == 'true'
        run: |
          set +e
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          WORK="$RUNNER_TEMP/resign"; rm -rf "$WORK"; mkdir -p "$WORK"
          unzip -q "$IPA" -d "$WORK"
          APP=$(find "$WORK/Payload" -maxdepth 1 -name '*.app' -type d | head -1)

          # Where the certificate actually lives. `find-identity -p codesigning`
          # came back EMPTY on the first attempt and took the whole job down with
          # it: cloud signing puts the certificate in a temporary keychain that
          # is not in the default search list once xcodebuild has finished.
          echo '--- keychains ---'; security list-keychains
          echo '--- identities ---'; security find-identity -v

          # The app in front of us was signed minutes ago, so it knows the exact
          # name of the identity that signed it. Ask it, rather than searching.
          IDENT=$(codesign -dvv "$APP" 2>&1 | sed -n 's/^Authority=//p' | head -1)
          if [ -z "$IDENT" ]; then
            IDENT=$(security find-identity -v | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          fi
          echo "re-signing as: [$IDENT]"

          if [ -z "$IDENT" ]; then
            echo "NO SIGNING IDENTITY FOUND — leaving the export untouched."
            echo "The build still ships; Sign in with Apple will not work in it."
            exit 0
          fi

          codesign -d --entitlements :- "$APP" > "$WORK/ent.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin array" "$WORK/ent.plist" 2>/dev/null
          /usr/libexec/PlistBuddy -c "Add :com.apple.developer.applesignin:0 string Default" "$WORK/ent.plist"
          codesign --force --sign "$IDENT" --entitlements "$WORK/ent.plist"             --preserve-metadata=identifier,flags,runtime "$APP"
          if [ $? -ne 0 ]; then
            echo "RE-SIGN FAILED — shipping the export as it was."
            exit 0
          fi
          rm -f "$IPA"
          (cd "$WORK" && zip -qry "$IPA" Payload)
          echo "re-signed and repacked"

      # What is in the SIGNED app, not what was in the project.
      #
      # `-exportArchive` re-signs, and a re-sign can only keep an entitlement the
      # provisioning profile actually grants. So the archive can carry
      # com.apple.developer.applesignin, the build log can say it was set, and
      # the .ipa on a phone can still be missing it — which is what the native
      # sheet reports as AuthorizationError, a message that names neither the
      # entitlement nor the profile.
      #
      # This never fails the build. It prints the answer, so the next question is
      # settled by reading rather than by another guess.
      - name: What the signed app actually claims
        if: steps.keys.outputs.signed == 'true'
        run: |
          APP=$(find "$RUNNER_TEMP/export" -maxdepth 3 -name '*.app' -type d | head -1)
          if [ -z "$APP" ]; then
            IPA=$(find "$RUNNER_TEMP/export" -name '*.ipa' | head -1)
            rm -rf "$RUNNER_TEMP/peek" && mkdir -p "$RUNNER_TEMP/peek"
            unzip -q "$IPA" -d "$RUNNER_TEMP/peek"
            APP=$(find "$RUNNER_TEMP/peek/Payload" -maxdepth 1 -name '*.app' -type d | head -1)
          fi
          echo "app: $APP"
          echo '--- entitlements ---'
          codesign -d --entitlements :- "$APP" 2>/dev/null || echo '(could not read entitlements)'
          echo '--- profile capabilities ---'
          security cms -D -i "$APP/embedded.mobileprovision" 2>/dev/null             | plutil -extract Entitlements xml1 -o - - 2>/dev/null             | grep -A3 applesignin || echo 'NO applesignin IN THE PROFILE'

      # Uploading is deliberately a SEPARATE, manual choice. A push that
      # silently ships a build to TestFlight is how the wrong thing reaches
      # testers; download the .ipa, look at it, then run this on purpose.
      - name: Upload to TestFlight
        if: github.event_name == 'workflow_dispatch' && steps.keys.outputs.signed == 'true'
        run: |
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey ${{ secrets.ASC_KEY_ID }} --apiIssuer ${{ secrets.ASC_ISSUER_ID }}

      # altool puts the build in App Store Connect and stops there. A build with
      # no group assigned is a build nobody can install: VALID, invisible, while
      # the tester's phone keeps offering the previous one. That happened twice,
      # and both times the person who noticed was the one waiting for the update —
      # reporting bugs against code that was already fixed, because the fix sat in
      # a build their phone had never been offered.
      #
      # A step a human must remember after every upload is a step that will be
      # forgotten, and this one fails silently. So the workflow does it.
      - name: Hand the build to the internal testers
        if: github.event_name == 'workflow_dispatch' && steps.keys.outputs.signed == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: /Users/runner/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        run: node tools/asc-assign-build.js
