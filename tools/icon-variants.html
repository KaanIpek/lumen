<!DOCTYPE html>
<meta charset="utf-8" />
<title>LUMEN — icon variants</title>
<style>body{margin:0;background:#2a2a2c;padding:16px;font:13px system-ui;color:#ddd}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:10px}
figure{margin:0}figcaption{margin-top:6px;font-size:12px;color:#aaa;text-align:center}</style>
<!--
  Four directions for the app icon, drawn from the same primitives so they can be
  compared rather than admired one at a time.

  The rule they are all judged by: what survives at 40 pixels. Everything else —
  gradient, glow, detail — is what a 1024 render flatters and a home screen
  throws away.

    A  dive      the light falls to the floor, takes the gold, pulls up
    B  flow      the slow-motion moment: the orb ringed, magenta bleeding in
    C  flip      the reversal alone, as a glyph, no scene at all
    D  chase     the orb close up, the corridor only implied at the edges
-->
<div class="row" id="big"></div>
<div class="row" id="sheet"></div>
<script>
const S = 1024, CYAN = '#4df3ff', MAG = '#ff2fd0', GOLD = '#ffd15c', BG = '#05060f';
const TAU = Math.PI * 2;

function backdrop(x, tint) {
  x.fillStyle = BG; x.fillRect(0, 0, S, S);
  const g = x.createRadialGradient(S * 0.5, S * 0.52, 0, S * 0.5, S * 0.52, S * 0.72);
  g.addColorStop(0, tint || 'rgba(34,74,132,0.68)');
  g.addColorStop(0.6, 'rgba(14,26,58,0.42)');
  g.addColorStop(1, 'rgba(5,6,15,0)');
  x.fillStyle = g; x.fillRect(0, 0, S, S);
}

// A tapered ribbon along a path, with a brighter filament inside it. One fill
// each: stroking segments separately beads wherever the trail is thin.
function ribbon(x, at, wide, c0, c1, from, to) {
  const N = 200, half = (t) => 10 + wide * Math.pow(t, 1.5);
  const build = (k) => {
    const L = [], R = [];
    for (let i = 0; i <= N; i++) {
      const t = i / N, e = 0.0015;
      const [px, py] = at(t), [qx, qy] = at(Math.min(1, t + e));
      const dx = qx - px, dy = qy - py, len = Math.hypot(dx, dy) || 1;
      const nx = -dy / len, ny = dx / len, h = half(t) * k;
      L.push([px + nx * h, py + ny * h]); R.push([px - nx * h, py - ny * h]);
    }
    x.beginPath(); x.moveTo(L[0][0], L[0][1]);
    for (const p of L) x.lineTo(p[0], p[1]);
    for (let i = R.length - 1; i >= 0; i--) x.lineTo(R[i][0], R[i][1]);
    x.closePath(); x.fill();
  };
  const grad = (a, b) => {
    const g = x.createLinearGradient(from[0], from[1], to[0], to[1]);
    g.addColorStop(0, a); g.addColorStop(1, b); return g;
  };
  x.save(); x.shadowColor = c0; x.shadowBlur = 40;
  x.fillStyle = grad(c0 + '6b', c1); build(1);
  x.shadowBlur = 0;
  x.fillStyle = grad('rgba(210,255,255,0)', 'rgba(255,255,255,0.95)'); build(0.34);
  x.restore();
}
function orb(x, cx, cy, r, col) {
  x.save();
  x.shadowColor = col; x.shadowBlur = r * 1.5;
  x.fillStyle = col; x.beginPath(); x.arc(cx, cy, r, 0, TAU); x.fill();
  x.shadowBlur = 0;
  x.fillStyle = '#b6f7ff'; x.beginPath(); x.arc(cx, cy, r * 0.72, 0, TAU); x.fill();
  x.fillStyle = '#fff'; x.beginPath(); x.arc(cx, cy, r * 0.43, 0, TAU); x.fill();
  x.restore();
}
const quad = (p0, p1, p2, t) => {
  const u = 1 - t;
  return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0],
          u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]];
};

const V = {};

// A — the dive. The corridor is the game's own top and bottom wall.
V.dive = (x) => {
  const A = [[110, 215], [235, 700], [430, 856]], B = [[430, 856], [640, 800], [858, 268]];
  const at = (t) => (t < 0.42 ? quad(A[0], A[1], A[2], t / 0.42) : quad(B[0], B[1], B[2], (t - 0.42) / 0.58));
  backdrop(x);
  const WALL = 76;
  const wall = (y0, dir) => {
    const g = x.createLinearGradient(0, y0, 0, y0 + dir * WALL);
    g.addColorStop(0, '#c4109c'); g.addColorStop(0.72, MAG); g.addColorStop(1, '#ff8ae6');
    x.fillStyle = g; x.fillRect(0, Math.min(y0, y0 + dir * WALL), S, WALL);
  };
  x.save(); x.shadowColor = MAG; x.shadowBlur = 58; wall(0, 1); wall(S, -1); x.restore();
  ribbon(x, at, 54, CYAN, 'rgba(150,250,255,1)', A[0], B[2]);
  x.save(); x.shadowColor = GOLD; x.shadowBlur = 40; x.fillStyle = GOLD;
  x.beginPath(); x.arc(448, 846, 34, 0, TAU); x.fill(); x.restore();
  const [hx, hy] = at(0.995); orb(x, hx, hy, 68, CYAN);
};

// B — flow, the chosen one, redrawn to survive being small.
//
// The first pass was the prettiest at 1024 and the worst at 29: four thin rings
// an inch apart became grey noise the moment they were a pixel apart. That is
// the classic icon trap — judged at the size it will never be seen.
//
// Same idea, fewer and louder parts. TWO rings, thick, far apart and in the two
// colours the game already means something by. A much bigger orb, because at 29
// pixels the orb IS the icon and everything else is texture around it. The
// entry trail short and fat so it reads as a direction rather than a hair.
V.flow = (x) => {
  backdrop(x, 'rgba(104,24,132,0.78)');
  const cx = S * 0.5, cy = S * 0.5;

  // The outer ring carries the magenta of flow; the inner one the cyan of you.
  // Two is the most that survives: a third is the one that turns them to mush.
  x.save();
  x.lineWidth = 34; x.strokeStyle = MAG; x.shadowColor = MAG; x.shadowBlur = 60;
  x.globalAlpha = 0.92;
  x.beginPath(); x.arc(cx, cy, 396, 0, TAU); x.stroke();
  x.lineWidth = 22; x.strokeStyle = CYAN; x.shadowColor = CYAN; x.shadowBlur = 48;
  x.globalAlpha = 0.85;
  x.beginPath(); x.arc(cx, cy, 268, 0, TAU); x.stroke();
  x.restore();

  // Short, fat, unmistakably arriving.
  const at = (t) => quad([84, 940], [300, 800], [cx - 40, cy + 40], t);
  ribbon(x, at, 82, MAG, 'rgba(180,250,255,1)', [84, 940], [cx, cy]);

  orb(x, cx, cy, 150, CYAN);
};

// C — the flip, alone. No scene, no corridor: the reversal as a single mark.
// The bet is that a glyph beats a picture at 29 pixels.
V.flip = (x) => {
  backdrop(x);
  const A = [[212, 250], [268, 640], [512, 786]], B = [[512, 786], [756, 640], [812, 250]];
  const at = (t) => (t < 0.5 ? quad(A[0], A[1], A[2], t / 0.5) : quad(B[0], B[1], B[2], (t - 0.5) / 0.5));
  x.save(); x.globalAlpha = 0.5;
  ribbon(x, (t) => at(t * 0.5), 62, MAG, 'rgba(255,120,230,0.9)', A[0], A[2]);
  x.restore();
  ribbon(x, (t) => at(0.5 + t * 0.5), 62, CYAN, 'rgba(180,252,255,1)', B[0], B[2]);
  orb(x, 812, 250, 74, CYAN);
};

// D — chase. The orb close up, the corridor only implied by two edge bars. The
// most "arcade poster" of the four, and the one with the least to lose small.
V.chase = (x) => {
  backdrop(x);
  x.save(); x.shadowColor = MAG; x.shadowBlur = 60; x.fillStyle = MAG;
  x.fillRect(-10, 0, 120, S); x.fillRect(S - 110, 0, 120, S); x.restore();
  const at = (t) => quad([150, 792], [470, 700], [660, 392], t);
  ribbon(x, at, 74, CYAN, 'rgba(170,252,255,1)', [150, 792], [660, 392]);
  x.save(); x.shadowColor = GOLD; x.shadowBlur = 44; x.fillStyle = GOLD;
  x.beginPath(); x.arc(772, 690, 40, 0, TAU); x.fill(); x.restore();
  orb(x, 660, 392, 118, CYAN);
};

const NAMES = [['dive', 'A · dive'], ['flow', 'B · flow'], ['flip', 'C · flip'], ['chase', 'D · chase']];
const canvases = {};
for (const [k, label] of NAMES) {
  const c = document.createElement('canvas'); c.width = c.height = S;
  c.style.cssText = 'width:210px;height:210px;border-radius:46px';
  V[k](c.getContext('2d'));
  canvases[k] = c;
  const f = document.createElement('figure');
  f.appendChild(c);
  const cap = document.createElement('figcaption'); cap.textContent = label;
  f.appendChild(cap);
  document.getElementById('big').appendChild(f);
}

function post(name, el) {
  return fetch('http://localhost:5181/', { method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, data: el.toDataURL('image/png') }) });
}
// One sheet, every variant at the sizes a phone actually draws them.
window.__sheet = () => {
  const sizes = [120, 76, 60, 40, 29];
  const t = document.createElement('canvas');
  t.width = 500; t.height = NAMES.length * 150 + 10;
  const tx = t.getContext('2d');
  tx.fillStyle = '#3a3a3c'; tx.fillRect(0, 0, t.width, t.height);
  tx.fillStyle = '#ddd'; tx.font = '600 15px system-ui';
  NAMES.forEach(([k, label], row) => {
    const y = row * 150 + 14;
    tx.fillText(label, 14, y + 18);
    let px = 120;
    for (const size of sizes) {
      tx.save();
      tx.beginPath(); tx.roundRect(px, y, size, size, size * 0.225); tx.clip();
      tx.drawImage(canvases[k], px, y, size, size);
      tx.restore();
      px += size + 12;
    }
  });
  return post('variants.png', t);
};
window.__one = (k) => post(k + '.png', canvases[k]);

// Ship one variant at every size the project uses. The maskable pair is inset:
// Android may crop those to a circle, and the outer ring is exactly what a crop
// would take.
window.__ship = async (k) => {
  const src = canvases[k];
  const scaled = (size, inset, bg) => {
    const t = document.createElement('canvas'); t.width = t.height = size;
    const tx = t.getContext('2d');
    if (bg) { tx.fillStyle = bg; tx.fillRect(0, 0, size, size); }
    const d = Math.round(size * inset), o = Math.round((size - d) / 2);
    tx.drawImage(src, o, o, d, d);
    return t;
  };
  const out = [];
  for (const n of [1024, 512, 384, 256, 192, 180, 152, 144, 128, 96, 72, 48]) {
    out.push(['icon-' + n + '.png', scaled(n, 1, null)]);
  }
  out.push(['apple-touch-icon.png', scaled(180, 1, null)]);
  out.push(['favicon.png', scaled(64, 1, null)]);
  out.push(['icon-maskable-512.png', scaled(512, 0.78, '#05060f')]);
  out.push(['icon-maskable-192.png', scaled(192, 0.78, '#05060f')]);
  for (const [name, el] of out) await post(name, el);
  return out.length + ' written';
};
</script>
